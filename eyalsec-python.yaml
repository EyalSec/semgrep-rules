# python/command-injection/tainted-subprocess-argument.yaml
- id: tainted-subprocess-argument
  message: >-
    Request data is passed to a program as a command-line argument with no "--"
    before it. There is no shell, but a value that starts with "-" is read as an
    option (for example git's --upload-pack=... or curl's -o), which can run
    code or overwrite files. Put "--" before positional arguments the program
    accepts, and validate the value, for example that it does not start with
    "-".
