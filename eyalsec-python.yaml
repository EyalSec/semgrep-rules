  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: flask.render_template_string($SOURCE, ...)
      - pattern: jinja2.Template($SOURCE, ...)
      - pattern: jinja2.Environment(...).from_string($SOURCE, ...)
      - pattern: django.template.Template($SOURCE, ...)
      - pattern: django.template.Engine(...).from_string($SOURCE, ...)
      - pattern: mako.template.Template($SOURCE, ...)
      - pattern: tornado.template.Template($SOURCE, ...)
      - pattern: $APP.jinja_env.from_string($SOURCE, ...)
      - pattern: flask.current_app.jinja_env.from_string($SOURCE, ...)
      - patterns:
        - pattern: $ENV.from_string($SOURCE, ...)
        - pattern-either:
          - pattern-inside: |
              $ENV = jinja2.Environment(...)
              ...
          - pattern-inside: |
              $ENV = django.template.Engine(...)
              ...
          - pattern-inside: |
              $ENV = django.template.engines[...]
              ...
    - focus-metavariable: $SOURCE
# python/weak-randomness/random-for-secret-value.yaml
- id: random-for-secret-value
  message: >-
    The random module is used to make what looks like a secret (a token,
    password, reset code, nonce or key). random is a Mersenne Twister: after
    enough outputs an attacker can predict the next ones. Use the secrets
    module (secrets.token_urlsafe(), secrets.choice()) for anything that must
    be hard to guess.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
    owasp:
    - "A02:2021 - Cryptographic Failures"
    - "A04:2025 - Cryptographic Failures"
    technology:
    - python
    references:
    - https://eyalsec.com/vulnerabilities/weak-randomness
    - https://docs.python.org/3/library/random.html
    - https://docs.python.org/3/library/secrets.html
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    vulnerability_class:
    - Cryptographic Issues
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: random.$FUNC(...)
  - metavariable-regex:
      metavariable: $FUNC
      regex: ^(random|randint|randrange|choice|choices|getrandbits|sample|randbytes)$
  - pattern-either:
    - patterns:
      - pattern-inside: |
          def $SECRETFUNC(...):
            ...
      - metavariable-regex:
          metavariable: $SECRETFUNC
          regex: (?i).*(token|passw(or)?d|secret|otp|nonce|salt|api_?key|session_?(id|key)|csrf|reset_code|verification_code|invite_code)
    - patterns:
      - pattern-inside: $SECRETVAR = ...
      - metavariable-regex:
          metavariable: $SECRETVAR
          regex: (?i).*(token|passw(or)?d|secret|otp|nonce|salt|api_?key|session_?(id|key)|csrf|reset_code|verification_code|invite_code)
