rules:
- id: tainted-outbound-url
  message: >-
    Request data decides where the server sends an outbound request. A client
    can point it at internal services or a cloud metadata address
    (169.254.169.254) that only the server can reach. Build the URL on a fixed
    scheme and host, or resolve the host and refuse private, loopback and
    link-local addresses before connecting, with redirects turned off.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-918: Server-Side Request Forgery (SSRF)"
    owasp:
    - "A10:2021 - Server-Side Request Forgery (SSRF)"
    - "A01:2025 - Broken Access Control"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/ssrf
    - https://eyalsec.com/vulnerabilities/ssrf/django
    - https://eyalsec.com/vulnerabilities/ssrf/flask
    - https://eyalsec.com/vulnerabilities/ssrf/fastapi
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Server-Side Request Forgery (SSRF)
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  - pattern-either:
    # A URL whose scheme and host are fixed in code only lets the client pick
    # the path, which is not SSRF.
    - patterns:
      - pattern-either:
        - pattern: '"$PREFIX" + ...'
        - pattern: '"$PREFIX" % ...'
        - pattern: '"$PREFIX".format(...)'
        - pattern: 'f"$PREFIX{...}..."'
      - metavariable-regex:
          metavariable: $PREFIX
          regex: ^[a-zA-Z][a-zA-Z0-9+.-]*://[^/{}%]+/
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: $LIB.$METHOD($URL, ...)
        - metavariable-regex:
            metavariable: $LIB
            regex: ^(requests|httpx)$
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|stream)$
      - pattern: requests.request($VERB, $URL, ...)
      - pattern: httpx.request($VERB, $URL, ...)
      - pattern: urllib.request.urlopen($URL, ...)
      - pattern: urllib.request.Request($URL, ...)
      - pattern: socket.create_connection($URL, ...)
      - patterns:
        - pattern-either:
          - pattern-inside: |
              $CLIENT = $FACTORY(...)
              ...
          - pattern-inside: |
              with $FACTORY(...) as $CLIENT:
                ...
          - pattern-inside: |
              async with $FACTORY(...) as $CLIENT:
                ...
        - metavariable-regex:
            metavariable: $FACTORY
            regex: ^(requests\.Session|requests\.session|httpx\.Client|httpx\.AsyncClient|aiohttp\.ClientSession|urllib3\.PoolManager)$
        - pattern-either:
          - patterns:
            - pattern: $CLIENT.$METHOD($URL, ...)
            - metavariable-regex:
                metavariable: $METHOD
                regex: ^(get|post|put|patch|delete|head|options|stream)$
          - pattern: $CLIENT.request($VERB, $URL, ...)
    - focus-metavariable: $URL
