rules:
- id: random-for-secret-value
  message: >-
    The random module is used to make what looks like a secret (a token,
    password, reset code, nonce or key). random is a Mersenne Twister: after
    enough outputs an attacker can predict the next ones. Use the secrets
    module (secrets.token_urlsafe(), secrets.choice()) for anything that must
    be hard to guess.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
    owasp:
    - "A02:2021 - Cryptographic Failures"
    - "A04:2025 - Cryptographic Failures"
    technology:
    - python
    references:
    - https://eyalsec.com/vulnerabilities/weak-randomness
    - https://docs.python.org/3/library/random.html
    - https://docs.python.org/3/library/secrets.html
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    vulnerability_class:
    - Cryptographic Issues
  languages:
  - python
  severity: WARNING
  patterns:
  - pattern: random.$FUNC(...)
  - metavariable-regex:
      metavariable: $FUNC
      regex: ^(random|randint|randrange|choice|choices|getrandbits|sample|randbytes)$
  - pattern-either:
    - patterns:
      - pattern-inside: |
          def $SECRETFUNC(...):
            ...
      - metavariable-regex:
          metavariable: $SECRETFUNC
          regex: (?i).*(token|passw(or)?d|secret|otp|nonce|salt|api_?key|session_?(id|key)|csrf|reset_code|verification_code|invite_code)
    - patterns:
      - pattern-inside: $SECRETVAR = ...
      - metavariable-regex:
          metavariable: $SECRETVAR
          regex: (?i).*(token|passw(or)?d|secret|otp|nonce|salt|api_?key|session_?(id|key)|csrf|reset_code|verification_code|invite_code)
