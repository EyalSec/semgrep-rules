rules:
- id: tainted-shell-command
  message: >-
    Request data reaches a command that a shell interprets. A value such as
    "x; id" or "$(id)" runs a second command with the application's privileges.
    Pass an argument list without shell=True (subprocess.run(["convert", "--",
    path])) and validate the value against what it should be. shlex.quote() is
    the fallback when a shell is unavoidable.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    owasp:
    - "A03:2021 - Injection"
    - "A05:2025 - Injection"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/command-injection
    - https://eyalsec.com/vulnerabilities/command-injection/django
    - https://eyalsec.com/vulnerabilities/command-injection/flask
    - https://eyalsec.com/vulnerabilities/command-injection/fastapi
    - https://docs.python.org/3/library/subprocess.html#security-considerations
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Command Injection
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  - pattern-either:
    - pattern: shlex.quote(...)
    - pattern: pipes.quote(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD, ...)
      - pattern: subprocess.getoutput($CMD, ...)
      - pattern: subprocess.getstatusoutput($CMD, ...)
      - pattern: asyncio.create_subprocess_shell($CMD, ...)
      - pattern: $LOOP.subprocess_shell($PROTOCOL, $CMD, ...)
      - pattern: $SSH.exec_command($CMD, ...)
      - patterns:
        - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
        - metavariable-regex:
            metavariable: $FUNC
            regex: ^(run|call|check_call|check_output|Popen)$
    - focus-metavariable: $CMD
