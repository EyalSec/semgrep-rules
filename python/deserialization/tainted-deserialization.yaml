rules:
- id: tainted-deserialization
  message: >-
    Request data is deserialized with a format that can run code while it
    loads: pickle and its relatives, marshal, jsonpickle, or YAML without a
    safe loader. The payload runs before the application looks at the result,
    so validating afterwards is too late. Use JSON for data from clients, sign
    anything you must round-trip (itsdangerous), and load YAML with
    yaml.safe_load().
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-502: Deserialization of Untrusted Data"
    owasp:
    - "A08:2021 - Software and Data Integrity Failures"
    - "A08:2025 - Software or Data Integrity Failures"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/insecure-deserialization
    - https://eyalsec.com/vulnerabilities/insecure-deserialization/django
    - https://eyalsec.com/vulnerabilities/insecure-deserialization/flask
    - https://eyalsec.com/vulnerabilities/insecure-deserialization/fastapi
    - https://docs.python.org/3/library/pickle.html
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Insecure Deserialization
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: $MOD.$FUNC($DATA, ...)
        - metavariable-regex:
            metavariable: $MOD
            regex: ^(pickle|_pickle|cPickle|dill|cloudpickle|marshal|joblib)$
        - metavariable-regex:
            metavariable: $FUNC
            regex: ^(loads|load|Unpickler)$
      - pattern: jsonpickle.decode($DATA, ...)
      - pattern: pandas.read_pickle($DATA, ...)
      - pattern: numpy.load($DATA, ..., allow_pickle=True, ...)
      - pattern: yaml.unsafe_load($DATA, ...)
      - pattern: yaml.unsafe_load_all($DATA, ...)
      - pattern: yaml.full_load($DATA, ...)
      - pattern: yaml.full_load_all($DATA, ...)
      - patterns:
        - pattern-either:
          - pattern: yaml.load($DATA, ...)
          - pattern: yaml.load_all($DATA, ...)
        - pattern-not: yaml.$LOAD($DATA, Loader=yaml.SafeLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, Loader=yaml.CSafeLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, Loader=yaml.BaseLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, Loader=yaml.CBaseLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, yaml.SafeLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, yaml.CSafeLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, yaml.BaseLoader, ...)
        - pattern-not: yaml.$LOAD($DATA, yaml.CBaseLoader, ...)
    - focus-metavariable: $DATA
