rules:
- id: tainted-template-source
  message: >-
    Request data becomes the source of a server-side template. Template
    languages can reach Python objects, so a value like {{ ... }} can read
    configuration or run code. Keep templates constant and pass the data as
    context: render_template_string("Hello {{ name }}", name=name).
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
    owasp:
    - "A03:2021 - Injection"
    - "A05:2025 - Injection"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/server-side-template-injection
    - https://eyalsec.com/vulnerabilities/server-side-template-injection/django
    - https://eyalsec.com/vulnerabilities/server-side-template-injection/flask
    - https://eyalsec.com/vulnerabilities/server-side-template-injection/fastapi
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Code Injection
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: flask.render_template_string($SOURCE, ...)
      - pattern: jinja2.Template($SOURCE, ...)
      - pattern: jinja2.Environment(...).from_string($SOURCE, ...)
      - pattern: django.template.Template($SOURCE, ...)
      - pattern: django.template.Engine(...).from_string($SOURCE, ...)
      - pattern: mako.template.Template($SOURCE, ...)
      - pattern: tornado.template.Template($SOURCE, ...)
      - pattern: $APP.jinja_env.from_string($SOURCE, ...)
      - pattern: flask.current_app.jinja_env.from_string($SOURCE, ...)
      - patterns:
        - pattern: $ENV.from_string($SOURCE, ...)
        - pattern-either:
          - pattern-inside: |
              $ENV = jinja2.Environment(...)
              ...
          - pattern-inside: |
              $ENV = django.template.Engine(...)
              ...
          - pattern-inside: |
              $ENV = django.template.engines[...]
              ...
    - focus-metavariable: $SOURCE
