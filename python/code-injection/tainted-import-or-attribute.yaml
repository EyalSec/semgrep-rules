rules:
- id: tainted-import-or-attribute
  message: >-
    Request data picks which module is imported, which native library is
    loaded, or which attribute is read or written. A client can then reach
    modules and methods the code never meant to expose (os, subprocess, private
    helpers) or overwrite attributes such as is_admin. Map the input through a
    dictionary of allowed names to the objects themselves.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-470: Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"
    owasp:
    - "A03:2021 - Injection"
    - "A05:2025 - Injection"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/code-injection
    - https://cwe.mitre.org/data/definitions/470.html
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Code Injection
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: importlib.import_module($NAME, ...)
      - pattern: __import__($NAME, ...)
      - pattern: importlib.__import__($NAME, ...)
      - pattern: getattr($OBJ, $NAME, ...)
      - pattern: setattr($OBJ, $NAME, ...)
      - pattern: ctypes.CDLL($NAME, ...)
      - pattern: ctypes.PyDLL($NAME, ...)
      - pattern: ctypes.cdll.LoadLibrary($NAME)
      - pattern: ctypes.pydll.LoadLibrary($NAME)
    - focus-metavariable: $NAME
