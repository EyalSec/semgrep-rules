rules:
- id: tainted-sql-query
  message: >-
    Request data reaches the text of a SQL statement. The database runs whatever
    that text says, so a crafted value can read or change any row the
    application can. Keep the statement constant and pass values separately:
    cursor.execute("... WHERE name = %s", [name]), Model.objects.raw(sql, [name]),
    or text("... :name") with bound parameters. For a table, column or sort
    direction, map the input through an allowlist of known names.
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
    owasp:
    - "A03:2021 - Injection"
    - "A05:2025 - Injection"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/sql-injection
    - https://eyalsec.com/vulnerabilities/sql-injection/django
    - https://eyalsec.com/vulnerabilities/sql-injection/flask
    - https://eyalsec.com/vulnerabilities/sql-injection/fastapi
    - https://eyalsec.com/vulnerabilities/sql-injection/sqlalchemy
    - https://eyalsec.com/vulnerabilities/sql-injection/psycopg
    - https://cwe.mitre.org/data/definitions/89.html
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - SQL Injection
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  - pattern-either:
    # Query builders bind values as parameters; the statement they produce is
    # not request text even when a value inside it is.
    - pattern: sqlalchemy.select(...)
    - pattern: sqlalchemy.insert(...)
    - pattern: sqlalchemy.update(...)
    - pattern: sqlalchemy.delete(...)
    - pattern: $STMT.where(...)
    - pattern: $STMT.filter(...)
    - pattern: $STMT.filter_by(...)
    - pattern: $STMT.values(...)
    - pattern: $STMT.bindparams(...)
    - pattern: psycopg2.sql.Identifier(...)
    - pattern: psycopg2.sql.Literal(...)
    - pattern: psycopg.sql.Identifier(...)
    - pattern: psycopg.sql.Literal(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $CUR.execute($QUERY, ...)
      - pattern: $CUR.executemany($QUERY, ...)
      - pattern: $CUR.executescript($QUERY, ...)
      - pattern: $CUR.mogrify($QUERY, ...)
      - pattern: $CONN.exec_driver_sql($QUERY, ...)
      - pattern: $QS.raw($QUERY, ...)
      - pattern: $QS.extra(..., where=$QUERY, ...)
      - pattern: $QS.extra(..., select=$QUERY, ...)
      - pattern: $QS.extra(..., tables=$QUERY, ...)
      - pattern: $QS.extra(..., order_by=$QUERY, ...)
      - pattern: django.db.models.expressions.RawSQL($QUERY, ...)
      - pattern: django.db.models.RawSQL($QUERY, ...)
      - pattern: sqlalchemy.text($QUERY, ...)
      - pattern: sqlalchemy.sql.text($QUERY, ...)
      - pattern: sqlalchemy.sql.expression.text($QUERY, ...)
      - pattern: psycopg2.sql.SQL($QUERY)
      - pattern: psycopg.sql.SQL($QUERY)
      - pattern: pandas.read_sql($QUERY, ...)
      - pattern: pandas.read_sql_query($QUERY, ...)
    - focus-metavariable: $QUERY
