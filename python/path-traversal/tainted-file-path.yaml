rules:
- id: tainted-file-path
  message: >-
    Request data decides which file is opened, written, moved or deleted. A
    value containing "../", or an absolute path (os.path.join() discards
    everything before one), escapes the directory you meant to stay in.
    Resolve the final path and check it is inside the base directory
    (target.resolve().is_relative_to(base)), keep only os.path.basename(), or
    serve files with send_from_directory().
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
    owasp:
    - "A01:2021 - Broken Access Control"
    - "A01:2025 - Broken Access Control"
    technology:
    - python
    - django
    - flask
    - fastapi
    references:
    - https://eyalsec.com/vulnerabilities/path-traversal
    - https://eyalsec.com/vulnerabilities/path-traversal/django
    - https://eyalsec.com/vulnerabilities/path-traversal/flask
    - https://eyalsec.com/vulnerabilities/path-traversal/fastapi
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Path Traversal
  languages:
  - python
  severity: ERROR
  mode: taint
  pattern-sources:
  # Flask: anything read from the request object.
  - pattern: flask.request.$ANY
  # Django, Django REST framework, Starlette and FastAPI request objects.
  - patterns:
    - pattern-either:
      - pattern: request.$ATTR
      - pattern: self.request.$ATTR
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|files|view_args)$
  - patterns:
    - pattern-either:
      - pattern: request.$METHOD(...)
      - pattern: self.request.$METHOD(...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(json|form|body|get_json|get_data|stream)$
  # Flask and FastAPI route parameters (path, query and body parameters).
  - patterns:
    - pattern-either:
      - pattern-inside: |
          @$APP.$ROUTE(...)
          def $FUNC(..., $PARAM, ...):
            ...
      - pattern-inside: |
          @$APP.$ROUTE(...)
          async def $FUNC(..., $PARAM, ...):
            ...
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
    - focus-metavariable: $PARAM
    # FastAPI dependencies (a database session, the current user) are not input.
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM = Depends(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...):
          ...
    - pattern-not-inside: |
        def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
    - pattern-not-inside: |
        async def $FUNC(..., $PARAM: $TYPE = Security(...), ...):
          ...
  # Django URL parameters: the arguments after `request` in a view.
  - patterns:
    - pattern-inside: |
        def $VIEW(request, ..., $PARAM, ...):
          ...
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $VIEW
        regex: ^(?!test_)
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!(self|request|args|kwargs)$)
  pattern-sanitizers:
  # Conversions to a number or a UUID.
  - pattern-either:
    - pattern: int(...)
    - pattern: float(...)
    - pattern: len(...)
    - pattern: uuid.UUID(...)
  # Looking the value up in a constant table (ALLOWED[name], ALLOWED.get(name))
  # replaces it with a value chosen by the code.
  - patterns:
    - pattern-either:
      - pattern: $TABLE[$KEY]
      - pattern: $TABLE.get($KEY, ...)
    - metavariable-regex:
        metavariable: $TABLE
        regex: ^[A-Z][A-Z0-9_]*$
  # A membership test (if name in ALLOWED / if name not in ALLOWED) is how an
  # allowlist is written; treat the value as checked from there on.
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $VALUE in $ALLOWED
      - pattern: $VALUE not in $ALLOWED
    - focus-metavariable: $VALUE
  - pattern-either:
    - pattern: os.path.basename(...)
    - pattern: werkzeug.utils.secure_filename(...)
    - pattern: werkzeug.security.safe_join(...)
    - pattern: django.utils.text.get_valid_filename(...)
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $TARGET.is_relative_to(...)
      - pattern: $TARGET.relative_to(...)
    - focus-metavariable: $TARGET
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: open($PATH, ...)
      - pattern: io.open($PATH, ...)
      - pattern: codecs.open($PATH, ...)
      - pattern: os.open($PATH, ...)
      - pattern: flask.send_file($PATH, ...)
      - pattern: fastapi.responses.FileResponse($PATH, ...)
      - pattern: starlette.responses.FileResponse($PATH, ...)
      - patterns:
        - pattern: os.$FUNC($PATH, ...)
        - metavariable-regex:
            metavariable: $FUNC
            regex: ^(remove|unlink|rmdir|removedirs|makedirs|mkdir|mkfifo|rename|renames|replace|chmod|chown|truncate|listdir|scandir)$
      - patterns:
        - pattern: shutil.$FUNC(..., $PATH, ...)
        - metavariable-regex:
            metavariable: $FUNC
            regex: ^(copy|copy2|copyfile|copytree|move|rmtree|unpack_archive)$
      - patterns:
        - pattern: $PATH.$METHOD(...)
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(read_text|read_bytes|write_text|write_bytes|unlink|rmdir|touch|mkdir)$
    - focus-metavariable: $PATH
