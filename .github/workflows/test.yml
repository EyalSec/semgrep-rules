name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep==1.181.0
      - name: Validate rules
        run: semgrep --validate --metrics=off --config python/
      - name: Run rule tests
        run: semgrep --test --metrics=off python/
      - name: Check the bundle is current
        run: python3 scripts/bundle.py --check
